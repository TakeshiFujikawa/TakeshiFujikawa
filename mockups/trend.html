<!DOCTYPE html>

  </div>

  <div class="screen">

      <div>
        <p class="eyebrow">5/31 〜 6/6 の振り返り</p>
        <h1>トレンド</h1>

      <a class="icon-btn" href="#" aria-label="期間切替">

      <div class="section-title">今週のサマリー</div>
      <div class="card">
        <div class="row" style="margin-bottom:2px;">
          <span style="font-weight:800; font-size:14.5px; font-family:'Noto Sans JP',sans-serif;">コンディションスコアの推移</span>
          <span class="pill">平均 74</span>
        </div>
        <div class="trend-line">

            <defs>
              <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">

            </defs>
            <path d="M0,62 50,52 100,60 150,40 200,44 250,32 300,28 V96 H0 Z" fill="url(#g2)"/>

          </svg>
        </div>
        <div class="divider"></div>
        <div style="font-size:12.5px; line-height:1.8;">
          <div style="font-weight:700; font-family:'Noto Sans JP',sans-serif; margin-bottom:2px;">👍 今週よかったこと</div>

        </div>
        <div style="font-size:12.5px; line-height:1.8; margin-top:12px;">
          <div style="font-weight:700; font-family:'Noto Sans JP',sans-serif; margin-bottom:2px;">🎯 来週に向けて</div>
          <span style="color:var(--ink-soft);">夕食の栄養バランスにやや偏りが見られました。野菜多めの献立提案を活用してみましょう。</span>
        </div>
      </div>

      <div class="section-title">主要指標</div>
      <div class="card" style="font-size:12.5px;">
        <div class="row" style="padding:7px 0;"><span class="pill">⚖️ 体重</span><span style="font-weight:700;">68.4kg <span style="color:var(--teal-600);">▲0.3kg</span></span></div>
        <div class="divider" style="margin:2px 0;"></div>
        <div class="row" style="padding:7px 0;"><span class="pill">🏃 運動</span><span style="font-weight:700;">3回・計87分・約720kcal</span></div>
        <div class="divider" style="margin:2px 0;"></div>
        <div class="row" style="padding:7px 0;"><span class="pill">💤 睡眠</span><span style="font-weight:700;">平均 7時間12分</span></div>
        <div class="divider" style="margin:2px 0;"></div>
        <div class="row" style="padding:7px 0;"><span class="pill">🍽 食事</span><span style="font-weight:700;">記録 7/7日・バランス良好</span></div>
      </div>

      <a class="btn-secondary" href="trend.html">

    <div class="tabbar">
