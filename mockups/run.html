<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>走る | VitaOne モックアップ</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="phone">
  <div class="statusbar"></div>
  <div class="screen">
    <div class="appbar">
      <h1>走る</h1>
      <div class="icon">📍</div>
    </div>
    <div class="content">

      <div class="section-title">記録中（GPS計測）</div>
      <div class="card">
        <div class="run-stats">
          <div class="item"><div class="num">18:42</div><div class="lab">経過時間</div></div>
          <div class="item"><div class="num">3.2<span style="font-size:13px;">km</span></div><div class="lab">距離</div></div>
          <div class="item"><div class="num">5'51"</div><div class="lab">平均ペース /km</div></div>
        </div>
        <div class="start-btn">
          <span class="big">■ 終了</span>
          <span class="small">タップして記録を終了</span>
        </div>
        <div style="text-align:center; font-size:12px; color:var(--muted);">種目：ラン（自動判定）</div>
      </div>

      <div class="section-title">終了後のサマリー（イメージ）</div>
      <div class="card">
        <div class="map-placeholder"></div>
        <div class="row">
          <span style="font-size:13px;">推定消費カロリー</span>
          <span class="pill">約 240kcal</span>
        </div>
        <div style="font-size:12px;color:var(--muted); margin-top:8px; line-height:1.7;">
          記録後、消費カロリーは自動的に「今日の摂取バランス」「献立提案」に反映されます。
          ルートや実績の詳細は「もっと見る」から確認できます（メイン導線には出しません）。
        </div>
        <a class="btn-secondary" href="meal.html">この記録を踏まえた食事提案を見る →</a>
      </div>

    </div>

    <div class="tabbar">
      <a class="tab" href="home.html"><span class="ti">🏠</span>ホーム</a>
      <a class="tab" href="record.html"><span class="ti">📋</span>記録</a>
      <a class="tab active" href="run.html"><span class="ti">🏃</span>走る</a>
      <a class="tab" href="meal.html"><span class="ti">🍽</span>食事</a>
      <a class="tab" href="trend.html"><span class="ti">📈</span>トレンド</a>
    </div>
  </div>
</div>
</body>
</html>
